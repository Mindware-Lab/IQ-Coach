name: IQM Platform Phase 1

on:
  push:
    branches:
      - feature/iqm-platform-phase1
    paths:
      - "apps/iqm-platform/**"
      - ".github/workflows/iqm-platform-phase1.yml"
  pull_request:
    paths:
      - "apps/iqm-platform/**"
      - ".github/workflows/iqm-platform-phase1.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/iqm-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Prepare review snapshot
        if: success()
        run: |
          set -euo pipefail
          mkdir -p review-bundle
          cp -R dist review-bundle/dist
          git rev-parse HEAD > review-bundle/source-commit.txt
          git -C ../.. archive HEAD apps/iqm-platform apps/attention-coach/src apps/cognitive-bandwidth/src specs/SYNERGY_IQ_VISUAL_SCREEN_PLAN_v1.md specs/IQM_ADAPTIVE_JOURNEY_SPEC_v0.1.md | gzip > review-bundle/review-source.tar.gz
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Square and portrait journey checks
        run: npm run test:browser
      - name: Upload visual review build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synergy-iq-visual-review
          path: apps/iqm-platform/review-bundle/
          retention-days: 7
      - name: Upload screen review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synergy-iq-screen-review
          path: apps/iqm-platform/studio-review/
          retention-days: 7
